{
    "version": 9,
    "name": "Deep6 (Wizards & Warriors)",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Quake2 (Valve)", "initialmap": "initial.map" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".zip", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".png"]
    },
    "entities": {
        "definitions": [ "deep6.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [],
        "brushface": [
            { "name": "Water", "match": "contentflag", "flags": [ "water" ] },
            { "name": "Lava", "match": "contentflag", "flags": [ "lava" ] },
            { "name": "Clip", "attribs": [ "transparent" ], "match": "material", "pattern": "_special/clip" },
            { "name": "Skip", "attribs": [ "transparent" ], "match": "material", "pattern": "_special/skip" },
            { "name": "Nodraw", "attribs": [ "transparent" ], "match": "material", "pattern": "_special/nodraw" },
            { "name": "Hint", "attribs": [ "transparent" ], "match": "material", "pattern": "_special/hint" }
        ]
    },
    "faceattribs": {
        "defaults": { "scale": [0.5, 0.5] },
        "surfaceflags": [
            { "name": "nodraw", "description": "Face is kept but not drawn (texinfo -1)" },
            { "name": "terrain", "description": "Drawn as a terrain polygon when horizontal (overworld BSPs)" },
            { "name": "waterpass", "description": "Drawn in the water pass with the animated water texture" },
            { "name": "translucent", "description": "Drawn in the translucent (lava) pass" }
        ],
        "contentflags": [
            { "name": "water", "description": "Water volume (swimming); its faces get the water pass" },
            { "name": "lava", "description": "Lava volume; its faces get the translucent pass" },
            { "name": "clip", "description": "Collision only, never drawn" }
        ]
    },
    "softMapBounds": "-16384 -16384 -4096 16384 16384 4096"
}
